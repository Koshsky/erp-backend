root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o build/server ./cmd/service"
  entrypoint = ["./build/server"]
  include_ext = ["go", "yaml", "mod", "sum"]
  exclude_dir = ["migrations", "vendor", "build", "tmp"]
  send_interrupt = true
  kill_delay = 3
  # Poll instead of fsnotify: file events do not fire on some filesystems
  # (WSL/overlayfs/network mounts), leaving air blind to edits.
  poll = true
  poll_interval = 500

[log]
  time = true

[misc]
  clean_on_exit = true
