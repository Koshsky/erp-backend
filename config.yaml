server:
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  # Trusted reverse-proxy networks that may supply the real client IP via
  # X-Forwarded-For / X-Real-IP. Only nginx (in the docker app-network) is
  # allowed; never 0.0.0.0/0. MUST match the app-network subnet fixed in
  # docker-compose.yml (172.18.0.0/16) so the value is stable across rebuilds.
  # If unset/invalid the backend trusts nobody and rate limits on the proxy IP.
  trusted_proxies:
    - 172.18.0.0/16

jwt:
  access_expiry: 15m
  refresh_expiry: 168h
  # Refresh-кука: HttpOnly, SameSite=Strict. Флаг Secure применяется только за
  # реальным https (True — жёсткое требование https); по фактическому http
  # (нативный dev, прямой http-доступ) он снимается автоматически, иначе
  # браузер не сохранит куку и автопродление access-токена не заработает.
  refresh_cookie_secure: true
  issuer: mvs-erp

cors:
  allow_origins:
    - "*"
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Origin
    - Content-Type
    - Accept
    - Authorization
    - X-Requested-With
  expose_headers:
    - Content-Length
  allow_credentials: true
  max_age: 12h

rate_limiting:
  enabled: true
  requests_per_second: 10
  burst: 20
  cleanup_interval: 1m
  expiration: 10m

# Per authenticated user limit for protected /api/v1/* routes (keyed by the
# JWT user id, not by IP, so heavy users behind a shared NAT do not trip the
# public per-IP bucket and block their neighbors).
user_rate_limiting:
  enabled: true
  requests_per_second: 20
  burst: 40
  cleanup_interval: 1m
  expiration: 10m

postgres:
  max_conns: 25
  min_conns: 5
  max_conn_lifetime: 30m
  max_conn_idle_time: 5m
  health_check_period: 5m
  connect_timeout: 10s

logging:
  level: debug
  format: json

swagger:
  enabled: true

profiling:
  enabled: false
  # pprof только на loopback (AD-13): даже при включении наружу не торчит.
  address: "127.0.0.1:6060"

maintenance:
  enabled: false
  interval: 5m

tracing:
  enabled: true
  # OTLP/gRPC endpoint — in-stack Jaeger collector (see docker-compose.yml).
  exporter_endpoint: "jaeger:4317"
  service_name: "erp-backend"
  sampler_ratio: 1.0

rbac:
  # Период фоновой перезагрузки правил из Postgres (эвентуальная
  # консистентность между инстансами; локальные правки применяются сразу).
  refresh_interval: 30s
