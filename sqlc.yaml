version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "./migrations/V1__initial_schema.sql"
    queries:
      - "internal/repository/postgres/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/repository/postgres/sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: false
        emit_empty_slices: true