openapi: 3.0.0
info:
  title: MVS ERP API
  version: 1.0.0

servers:
  - url: /api

paths:
  # Auth
  /auth/register:
    post:
      summary: Register new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
  /auth/login:
    post:
      summary: Login
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /auth/logout:
    post:
      summary: Logout
      tags: [Auth]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "logout successful"
  /auth/refresh:
    post:
      summary: Refresh access token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: "eyJ..."
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  tokens:
                    $ref: '#/components/schemas/TokenPair'
                  message:
                    type: string
                    example: "token refreshed"
  /auth/change-password:
    post:
      summary: Change password
      tags: [Auth]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed

  # Users
  /users:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
  /users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update user
      tags: [Users]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user
      tags: [Users]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: User deleted

  # Projects
  /project:
    get:
      summary: Get all projects
      tags: [Projects]
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectResponse'
    post:
      summary: Create project
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: Project created
  /project/{id}:
    get:
      summary: Get project by ID
      tags: [Projects]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Project found
    put:
      summary: Update project
      tags: [Projects]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Project updated
    delete:
      summary: Delete project
      tags: [Projects]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Project deleted

  # Processes
  /process:
    get:
      summary: Get all processes
      tags: [Processes]
      responses:
        '200':
          description: List of processes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProcessResponse'
    post:
      summary: Create process
      tags: [Processes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProcessRequest'
      responses:
        '200':
          description: Process created
  /process/{id}:
    get:
      summary: Get process by ID
      tags: [Processes]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Process found
    put:
      summary: Update process
      tags: [Processes]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProcessRequest'
      responses:
        '200':
          description: Process updated
    delete:
      summary: Delete process
      tags: [Processes]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Process deleted

  # Tasks
  /task:
    get:
      summary: Get all tasks
      tags: [Tasks]
      responses:
        '200':
          description: List of tasks
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskResponse'
    post:
      summary: Create task
      tags: [Tasks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: Task created
  /task/{id}:
    get:
      summary: Get task by ID
      tags: [Tasks]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Task found
    put:
      summary: Update task
      tags: [Tasks]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
    delete:
      summary: Delete task
      tags: [Tasks]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Task deleted

  # Milestones
  /milestone:
    get:
      summary: Get all milestones
      tags: [Milestones]
      responses:
        '200':
          description: List of milestones
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MilestoneResponse'
    post:
      summary: Create milestone
      tags: [Milestones]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMilestoneRequest'
      responses:
        '200':
          description: Milestone created
  /milestone/{id}:
    get:
      summary: Get milestone by ID
      tags: [Milestones]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Milestone found
    put:
      summary: Update milestone
      tags: [Milestones]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMilestoneRequest'
      responses:
        '200':
          description: Milestone updated
    delete:
      summary: Delete milestone
      tags: [Milestones]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Milestone deleted

  # Resources
  /resource:
    get:
      summary: Get all resources
      tags: [Resources]
      responses:
        '200':
          description: List of resources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ResourceResponse'
    post:
      summary: Create resource
      tags: [Resources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '200':
          description: Resource created
  /resource/{id}:
    get:
      summary: Get resource by ID
      tags: [Resources]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Resource found
    put:
      summary: Update resource
      tags: [Resources]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Resource updated
    delete:
      summary: Delete resource
      tags: [Resources]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Resource deleted

  # Assignments
  /assignment:
    get:
      summary: Get all assignments
      tags: [Assignments]
      responses:
        '200':
          description: List of assignments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AssignmentResponse'
    post:
      summary: Create assignment
      tags: [Assignments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        '200':
          description: Assignment created
  /assignment/{id}:
    get:
      summary: Get assignment by ID
      tags: [Assignments]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Assignment found
    put:
      summary: Update assignment
      tags: [Assignments]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAssignmentRequest'
      responses:
        '200':
          description: Assignment updated
    delete:
      summary: Delete assignment
      tags: [Assignments]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: Assignment deleted

  # Scheduling
  /scheduling/projects:
    get:
      summary: Get project scheduling
      description: Возвращает все проекты для построения диаграммы Ганта
      tags: [Scheduling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project scheduling data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectSchedulingResponse'
  /scheduling/processes:
    get:
      summary: Get process scheduling
      description: Возвращает процессы с привязкой к проектам для построения диаграммы Ганта
      tags: [Scheduling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Process scheduling data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ProcessSchedulingResponse'
  /scheduling/tasks:
    get:
      summary: Get task scheduling
      description: Возвращает задачи с процессами, проектами, назначениями, вехами и ресурсами для построения диаграммы Ганта
      tags: [Scheduling]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Task scheduling data
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TaskSchedulingResponse'

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # === Auth ===
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: "ivanov"
        password:
          type: string
          format: password
          example: "securepassword123"
    LoginResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer, format: int64, example: 1 }
            name: { type: string, example: "Иван Иванов" }
            username: { type: string, example: "ivanov" }
            role: { type: string, example: "admin" }
        tokens:
          $ref: '#/components/schemas/TokenPair'
    RegisterRequest:
      type: object
      required: [name, username, password]
      properties:
        name: { type: string, example: "Иван Иванов" }
        username: { type: string, example: "ivanov" }
        password: { type: string, format: password, example: "securepassword123" }
        role: { type: string, enum: [ДП, РП, ВП], default: ДП, example: "ДП" }
  RegisterResponse:
      type: object
      properties:
        user:
          type: object
          properties:
            id: { type: integer, format: int64, example: 2 }
            name: { type: string, example: "Иван Иванов" }
            username: { type: string, example: "ivanov" }
            role: { type: string, example: "manager" }
        tokens:
          $ref: '#/components/schemas/TokenPair'
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 900
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password:
          type: string
          format: password
          example: "oldpass123"
        new_password:
          type: string
          format: password
          example: "newpass456"

    # === User ===
    CreateUserRequest:
      type: object
      required: [name, username, role, password]
      properties:
        name: { type: string, example: "Иван Иванов" }
        username: { type: string, example: "ivanov" }
        role: { type: string, enum: [ДП, РП, ВП], example: "ДП" }
        password: { type: string, format: password, example: "securepassword123" }
    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, example: "Иван Иванов" }
        username: { type: string, example: "ivanov" }
        role: { type: string, enum: [ДП, РП, ВП], example: "РП" }
        password: { type: string, format: password }
    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        name: { type: string, example: "Иван Иванов" }
        username: { type: string, example: "ivanov" }
        role: { type: string, enum: [ДП, РП, ВП], example: "ДП" }
  # === Project ===
    CreateProjectRequest:
      type: object
      required: [code, start_date, end_date, priority]
      properties:
        code: { type: string, example: "KO-1001" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
        priority: { type: integer, example: 1 }
    UpdateProjectRequest:
      type: object
      properties:
        code: { type: string, example: "KO-1001" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
        priority: { type: integer, example: 2 }
    ProjectResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        owner_id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: "KO-1001" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
        priority: { type: integer, example: 1 }

    # === Process ===
    CreateProcessRequest:
      type: object
      required: [project_id, title, start_date, end_date]
      properties:
        project_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Инсталляция" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
    UpdateProcessRequest:
      type: object
      properties:
        title: { type: string, example: "Инсталляция" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
    ProcessResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        owner_id: { type: integer, format: int64, example: 1 }
        project_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Инсталляция" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }

    # === Task ===
    CreateTaskRequest:
      type: object
      required: [process_id, title, start_date, end_date]
      properties:
        process_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Осмотр объекта" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string, example: "Осмотр объекта" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
    TaskResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        process_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Осмотр объекта" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }

    # === Milestone ===
    CreateMilestoneRequest:
      type: object
      required: [process_id, title, content, date]
      properties:
        process_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Ввод в эксплуатацию" }
        content: { type: string, example: "Подписан акт ввода в эксплуатацию" }
        date: { type: string, format: date, example: "2026-08-22" }
    UpdateMilestoneRequest:
      type: object
      properties:
        title: { type: string, example: "Ввод в эксплуатацию" }
        content: { type: string, example: "Подписан акт ввода в эксплуатацию" }
        date: { type: string, format: date, example: "2026-08-22" }
    MilestoneResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        process_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Ввод в эксплуатацию" }
        content: { type: string, example: "Подписан акт ввода в эксплуатацию" }
        date: { type: string, format: date, example: "2026-08-22" }

    # === Resource ===
    CreateResourceRequest:
      type: object
      required: [code, title, quantity]
      properties:
        code: { type: string, example: "И" }
        title: { type: string, example: "Инженер" }
        quantity: { type: integer, example: 7 }
    UpdateResourceRequest:
      type: object
      properties:
        code: { type: string, example: "И" }
        title: { type: string, example: "Инженер" }
        quantity: { type: integer, example: 5 }
    ResourceResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: "И" }
        title: { type: string, example: "Инженер" }
        quantity: { type: integer, example: 7 }

    # === Assignment ===
    CreateAssignmentRequest:
      type: object
      required: [task_id, resource_id, quantity]
      properties:
        task_id: { type: integer, format: int64, example: 1 }
        resource_id: { type: integer, format: int64, example: 5 }
        quantity: { type: integer, example: 1 }
    UpdateAssignmentRequest:
      type: object
      properties:
        quantity: { type: integer, example: 2 }
    AssignmentResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        task_id: { type: integer, format: int64, example: 1 }
        resource_id: { type: integer, format: int64, example: 5 }
        quantity: { type: integer, example: 1 }

    # === Scheduling ===
    Timeline:
      type: object
      properties:
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-10-25" }
        total_days: { type: integer, example: 0 }

    SchedulingProject:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        owner_id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: "KO-1001" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }
        priority: { type: integer, example: 1 }

    SchedulingProcess:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        owner_id: { type: integer, format: int64, example: 1 }
        project_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Инсталляция" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }

    SchedulingTask:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        process_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Осмотр объекта" }
        start_date: { type: string, format: date, example: "2026-07-15" }
        end_date: { type: string, format: date, example: "2026-08-30" }

    SchedulingMilestone:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        process_id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: "Ввод в эксплуатацию" }
        content: { type: string, example: "Подписан акт ввода в эксплуатацию" }
        date: { type: string, format: date, example: "2026-08-22" }

    SchedulingAssignment:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        task_id: { type: integer, format: int64, example: 1 }
        resource_id: { type: integer, format: int64, example: 5 }
        quantity: { type: integer, example: 1 }

    SchedulingResource:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        code: { type: string, example: "И" }
        title: { type: string, example: "Инженер" }
        quantity: { type: integer, example: 7 }

    ProjectSchedulingResponse:
      type: object
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingProject'
        timeline:
          $ref: '#/components/schemas/Timeline'

    ProcessSchedulingResponse:
      type: object
      properties:
        processes:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingProcess'
        projects:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchedulingProject'
        timeline:
          $ref: '#/components/schemas/Timeline'

    TaskSchedulingResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/SchedulingTask'
        processes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchedulingProcess'
        projects:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchedulingProject'
        milestones:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SchedulingMilestone'
        assignments:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SchedulingAssignment'
        resources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SchedulingResource'
        timeline:
          $ref: '#/components/schemas/Timeline'

