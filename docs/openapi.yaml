components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  schemas:
    CreateUserRequest:
      type: object
      required: [name, username, role, password]
      properties:
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, manager, user] }
        password: { type: string, format: password }
    UpdateUserRequest:
      type: object
      properties:
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, manager, user] }
        password: { type: string, format: password }
    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, manager, user] }

    CreateProjectRequest:
      type: object
      required: [code, start_date, end_date, priority]
      properties:
        code: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        priority: { type: integer }
    UpdateProjectRequest:
      type: object
      properties:
        code: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        priority: { type: integer }
    ProjectResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        priority: { type: integer }

    CreateProcessRequest:
      type: object
      required: [project_id, title, start_date, end_date]
      properties:
        project_id: { type: integer, format: int64 }
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    UpdateProcessRequest:
      type: object
      properties:
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    ProcessResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        project_id: { type: integer, format: int64 }
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    CreateTaskRequest:
      type: object
      required: [process_id, title, start_date, end_date]
      properties:
        process_id: { type: integer, format: int64 }
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    TaskResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        process_id: { type: integer, format: int64 }
        title: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }

    CreateMilestoneRequest:
      type: object
      required: [process_id, title, content, date]
      properties:
        process_id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        date: { type: string, format: date }
    UpdateMilestoneRequest:
      type: object
      properties:
        title: { type: string }
        content: { type: string }
        date: { type: string, format: date }
    MilestoneResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        process_id: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string }
        date: { type: string, format: date }

    CreateResourceRequest:
      type: object
      required: [code, title, quantity]
      properties:
        code: { type: string }
        title: { type: string }
        quantity: { type: integer }
    UpdateResourceRequest:
      type: object
      properties:
        code: { type: string }
        title: { type: string }
        quantity: { type: integer }
    ResourceResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string }
        title: { type: string }
        quantity: { type: integer }

    CreateAssignmentRequest:
      type: object
      required: [task_id, resource_id, quantity]
      properties:
        task_id: { type: integer, format: int64 }
        resource_id: { type: integer, format: int64 }
        quantity: { type: integer }
    UpdateAssignmentRequest:
      type: object
      properties:
        quantity: { type: integer }
    AssignmentResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        task_id: { type: integer, format: int64 }
        resource_id: { type: integer, format: int64 }
        quantity: { type: integer }

tags:
  - name: Users
  - name: Projects
  - name: Processes
  - name: Tasks
  - name: Milestones
  - name: Resources
  - name: Assignments
