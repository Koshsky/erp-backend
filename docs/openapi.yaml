components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      description: Resource ID

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Base response
    Response:
      type: object
      properties:
        data:
          description: Response data (can be object or array)
      required:
        - data

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
      required:
        - error

    # Project schemas
    ProjectResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          example: "PRJ-2026-001"
        start_date:
          type: string
          format: date
          example: "2026-01-01"
        end_date:
          type: string
          format: date
          example: "2026-12-31"
        priority:
          type: integer
          example: 1

    CreateProjectRequest:
      type: object
      required:
        - code
        - start_date
        - end_date
        - priority
      properties:
        code:
          type: string
          example: "PRJ-2026-001"
        start_date:
          type: string
          format: date
          example: "2026-01-01"
        end_date:
          type: string
          format: date
          example: "2026-12-31"
        priority:
          type: integer
          example: 1

    UpdateProjectRequest:
      type: object
      properties:
        code:
          type: string
          example: "PRJ-2026-001"
        start_date:
          type: string
          format: date
          example: "2026-01-01"
        end_date:
          type: string
          format: date
          example: "2026-12-31"
        priority:
          type: integer
          example: 2

    # Process schemas
    ProcessResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        project_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Development Phase"
        start_date:
          type: string
          format: date
          example: "2026-01-15"
        end_date:
          type: string
          format: date
          example: "2026-03-15"

    CreateProcessRequest:
      type: object
      required:
        - project_id
        - title
        - start_date
        - end_date
      properties:
        project_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Development Phase"
        start_date:
          type: string
          format: date
          example: "2026-01-15"
        end_date:
          type: string
          format: date
          example: "2026-03-15"

    UpdateProcessRequest:
      type: object
      properties:
        title:
          type: string
          example: "Updated Development Phase"
        start_date:
          type: string
          format: date
          example: "2026-01-15"
        end_date:
          type: string
          format: date
          example: "2026-03-30"

    ProcessDetailResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/ProcessResponse'
        - type: object
          properties:
            tasks:
              type: array
              items:
                $ref: '#/components/schemas/TaskDetailResponse'
            milestones:
              type: array
              items:
                $ref: '#/components/schemas/MilestoneResponse'

    # Task schemas
    TaskResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        process_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Implement API"
        start_date:
          type: string
          format: date
          example: "2026-01-20"
        end_date:
          type: string
          format: date
          example: "2026-02-10"

    CreateTaskRequest:
      type: object
      required:
        - process_id
        - title
        - start_date
        - end_date
      properties:
        process_id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "Implement API"
        start_date:
          type: string
          format: date
          example: "2026-01-20"
        end_date:
          type: string
          format: date
          example: "2026-02-10"

    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
          example: "Updated API Implementation"
        start_date:
          type: string
          format: date
          example: "2026-01-20"
        end_date:
          type: string
          format: date
          example: "2026-02-15"

    TaskDetailResponse:
      type: object
      allOf:
        - $ref: '#/components/schemas/TaskResponse'
        - type: object
          properties:
            assignments:
              type: array
              items:
                $ref: '#/components/schemas/AssignmentResponse'

    # Milestone schemas
    MilestoneResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
