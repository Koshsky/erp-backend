openapi: 3.0.0
info:
  title: MVS ERP API
  version: 1.0.0

servers:
  - url: /api

paths:
  # Users
  /users:
    get:
      summary: Get all users
      tags: [Users]
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResponse'
    post:
      summary: Create user
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
  /users/{id}:
    get:
      summary: Get user by ID
      tags: [Users]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/UserResponse'
    put:
      summary: Update user
      tags: [Users]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
    delete:
      summary: Delete user
      tags: [Users]
      parameters: [ $ref: '#/components/parameters/IdParam' ]
      responses:
        '200':
          description: User deleted

