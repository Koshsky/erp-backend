openapi: 3.0.0
info:
  title: MVS ERP API
  description: API для управления проектами, процессами, задачами, ресурсами и пользователями
  version: 1.0.0
  contact:
    name: MVS ERP Team

servers:
  - url: /api/v1
    description: API v1

paths:
  # Health Check
  /api/health:
    get:
      summary: Health check endpoint
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # Projects
  /projects:
