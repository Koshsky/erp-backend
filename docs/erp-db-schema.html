<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERP — схема БД</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --fg: #172033;
    --muted: #5b6475;
    --line: #64748b;
    --neutral: #e2e8f0;
    --head: #cbd5e1;
    --input: #bfdbfe;
    --process: #c7d2fe;
    --storage: #99f6e4;
    --external: #fde68a;
    --risk: #fecaca;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a;
      --fg: #e5e7eb;
      --muted: #a3adbd;
      --line: #94a3b8;
      --neutral: #334155;
      --head: #475569;
      --input: #1d4ed8;
      --process: #4338ca;
      --storage: #0f766e;
      --external: #92400e;
      --risk: #991b1b;
    }
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font:
      14px/1.4 ui-sans-serif,
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      sans-serif;
  }
  main {
    max-width: 1180px;
    margin: 32px auto;
    padding: 0 20px;
  }
  svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .title {
    font-size: 20px;
    font-weight: 650;
    fill: var(--fg);
  }
  .subtitle {
    font-size: 13px;
    fill: var(--muted);
  }
  .label {
    font-size: 14px;
    font-weight: 600;
    fill: var(--fg);
  }
  .small {
    font-size: 12px;
    fill: var(--muted);
  }
  .node {
    stroke: var(--line);
    stroke-width: 1;
  }
  .tbl-head {
    fill: var(--head);
    stroke: var(--line);
    stroke-width: 1;
  }
  .neutral {
    fill: var(--neutral);
  }
  .edge {
    stroke: var(--line);
    stroke-width: 1.5;
    fill: none;
  }
  .col {
    font-size: 13px;
    fill: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .pk {
    font-weight: 700;
  }
  .fk {
    fill: var(--process);
  }
  .badge {
    font-size: 10px;
    font-weight: 700;
    fill: var(--fg);
  }
</style>
<main>
<svg viewBox="0 0 1120 1010" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ER-диаграмма базы данных ERP">
  <text x="0" y="24" class="title">ERP — схема базы данных</text>
  <text x="0" y="44" class="subtitle">7 таблиц · soft delete · миграции backend/migrations (V1–V3, V10)</text>

  <!-- ============ CONNECTORS (behind boxes) ============ -->
  <!-- users -> projects -->
  <path d="M 565 192 L 565 230" class="edge"/>
  <text x="578" y="217" class="small">owner_id</text>
  <text x="551" y="213" class="badge">1</text>
  <text x="551" y="228" class="badge">N</text>
  <!-- users -> processes (left route) -->
  <path d="M 425 120 L 330 120 L 330 529 L 425 529" class="edge"/>
  <text x="336" y="330" class="small">owner_id</text>
  <text x="418" y="126" class="badge">1</text>
  <text x="420" y="542" class="badge">N</text>
  <!-- projects -> processes -->
  <path d="M 565 404 L 565 442" class="edge"/>
  <text x="578" y="429" class="small">project_id</text>
  <text x="551" y="425" class="badge">1</text>
  <text x="551" y="440" class="badge">N</text>
  <!-- processes -> tasks -->
  <path d="M 565 616 L 565 654" class="edge"/>
  <text x="578" y="641" class="small">process_id</text>
  <text x="551" y="637" class="badge">1</text>
  <text x="551" y="652" class="badge">N</text>
  <!-- processes -> milestones -->
  <path d="M 695 529 L 780 529" class="edge"/>
  <text x="700" y="521" class="small">process_id</text>
  <text x="706" y="541" class="badge">1</text>
  <text x="758" y="541" class="badge">N</text>
  <!-- tasks -> assignments -->
  <path d="M 565 806 L 565 844" class="edge"/>
  <text x="578" y="831" class="small">task_id</text>
  <text x="551" y="827" class="badge">1</text>
  <text x="551" y="842" class="badge">N</text>
  <!-- resources -> assignments -->
  <path d="M 780 909 L 695 909" class="edge"/>
  <text x="700" y="901" class="small">resource_id</text>
  <text x="714" y="921" class="badge">1</text>
  <text x="752" y="921" class="badge">N</text>

  <!-- ============ users ============ -->
  <rect x="425" y="40" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="425" y="74" width="270" height="118" class="node neutral" rx="4"/>
  <text x="437" y="62" class="label">users</text>
  <text x="437" y="92" class="col pk">id</text><text x="668" y="92" class="badge">PK</text>
  <text x="437" y="114" class="col">name</text>
  <text x="437" y="136" class="col">role</text><text x="475" y="136" class="small">ДП · РП · ВП</text>
  <text x="437" y="158" class="col">username</text><text x="523" y="158" class="small">uniq active</text>
  <text x="437" y="180" class="col">password_hash</text>

  <!-- ============ projects ============ -->
  <rect x="425" y="230" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="425" y="264" width="270" height="140" class="node neutral" rx="4"/>
  <text x="437" y="252" class="label">projects</text>
  <text x="437" y="282" class="col pk">id</text><text x="668" y="282" class="badge">PK</text>
  <text x="437" y="304" class="col fk">owner_id</text><text x="507" y="304" class="small">→ users</text>
  <text x="437" y="326" class="col">code</text><text x="485" y="326" class="small">uniq active</text>
  <text x="437" y="348" class="col">start_date</text>
  <text x="437" y="370" class="col">end_date</text><text x="500" y="370" class="small">≥ start</text>
  <text x="437" y="392" class="col">priority</text>

  <!-- ============ processes ============ -->
  <rect x="425" y="442" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="425" y="476" width="270" height="140" class="node neutral" rx="4"/>
  <text x="437" y="464" class="label">processes</text>
  <text x="437" y="494" class="col pk">id</text><text x="668" y="494" class="badge">PK</text>
  <text x="437" y="516" class="col fk">project_id</text><text x="510" y="516" class="small">→ projects CASCADE</text>
  <text x="437" y="538" class="col fk">owner_id</text><text x="507" y="538" class="small">→ users</text>
  <text x="437" y="560" class="col">title</text>
  <text x="437" y="582" class="col">start_date</text>
  <text x="437" y="604" class="col">end_date</text><text x="500" y="604" class="small">≥ start</text>

  <!-- ============ tasks ============ -->
  <rect x="425" y="654" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="425" y="688" width="270" height="118" class="node neutral" rx="4"/>
  <text x="437" y="676" class="label">tasks</text>
  <text x="437" y="706" class="col pk">id</text><text x="668" y="706" class="badge">PK</text>
  <text x="437" y="728" class="col fk">process_id</text><text x="512" y="728" class="small">→ processes CASCADE</text>
  <text x="437" y="750" class="col">title</text>
  <text x="437" y="772" class="col">start_date</text>
  <text x="437" y="794" class="col">end_date</text><text x="500" y="794" class="small">≥ start</text>

  <!-- ============ assignments ============ -->
  <rect x="425" y="844" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="425" y="878" width="270" height="96" class="node neutral" rx="4"/>
  <text x="437" y="866" class="label">assignments</text>
  <text x="437" y="896" class="col pk">id</text><text x="668" y="896" class="badge">PK</text>
  <text x="437" y="918" class="col fk">task_id</text><text x="497" y="918" class="small">→ tasks CASCADE</text>
  <text x="437" y="940" class="col fk">resource_id</text><text x="517" y="940" class="small">→ resources RESTRICT</text>
  <text x="437" y="962" class="col">quantity</text><text x="495" y="962" class="small">uniq (task,res)</text>

  <!-- ============ milestones ============ -->
  <rect x="780" y="442" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="780" y="476" width="270" height="118" class="node neutral" rx="4"/>
  <text x="792" y="464" class="label">milestones</text>
  <text x="792" y="494" class="col pk">id</text><text x="1023" y="494" class="badge">PK</text>
  <text x="792" y="516" class="col fk">process_id</text><text x="867" y="516" class="small">→ processes CASCADE</text>
  <text x="792" y="538" class="col">title</text>
  <text x="792" y="560" class="col">content</text>
  <text x="792" y="582" class="col">date</text>

  <!-- ============ resources ============ -->
  <rect x="780" y="844" width="270" height="34" class="tbl-head" rx="4"/>
  <rect x="780" y="878" width="270" height="96" class="node neutral" rx="4"/>
  <text x="792" y="866" class="label">resources</text>
  <text x="792" y="896" class="col pk">id</text><text x="1023" y="896" class="badge">PK</text>
  <text x="792" y="918" class="col">title</text><text x="840" y="918" class="small">uniq active</text>
  <text x="792" y="940" class="col">code</text><text x="832" y="940" class="small">uniq active</text>
  <text x="792" y="962" class="col">quantity</text>

  <!-- ============ legend ============ -->
  <text x="0" y="990" class="small">PK — первичный ключ · FK — внешний ключ · CASCADE/RESTRICT — поведение при удалении · у всех таблиц: created_at, updated_at, deleted_at (мягкое удаление) · уникальность только среди активных записей</text>
</svg>
</main>
