# CI for erp-backend.
# Checks: branch policy, build + vet + unit tests, generated-code drift
# (sqlc/wire/swag), integration tests (auth sessions against real postgres),
# golangci-lint. The "CI / Branch policy" check is the required status check
# for main/staging/dev (see scripts/branch-protection/ in erp-infra); the
# rest are gating checks that should be added to the required set in the
# repository settings (M8).
name: CI

on:
  pull_request:
  push:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  # Branch policy: main accepts pull requests only from staging,
  # staging accepts pull requests only from dev, dev accepts pull requests
  # only from feature/* and hotfix/*.
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        # On push (no PR) base_ref/head_ref are empty — the `*` branch is
        # matched and the check passes.
        run: |
          case "$BASE" in
            main)
              [ "$HEAD" = "staging" ] && echo "PASS: source branch 'staging' is permitted for target branch 'main'" \
                || { echo "FAIL: target branch 'main' requires source branch 'staging'; received '$HEAD'"; exit 1; }
              ;;
            staging)
              [ "$HEAD" = "dev" ] && echo "PASS: source branch 'dev' is permitted for target branch 'staging'" \
                || { echo "FAIL: target branch 'staging' requires source branch 'dev'; received '$HEAD'"; exit 1; }
              ;;
            dev)
              case "$HEAD" in
                feature/*|hotfix/*) echo "PASS: source branch '$HEAD' is permitted for target branch 'dev'" ;;
                *) echo "FAIL: target branch 'dev' requires a source branch matching 'feature/*' or 'hotfix/*'; received '$HEAD'"; exit 1 ;;
              esac
              ;;
            *)
              exit 0
              ;;
          esac

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  generated:
    name: Generated code is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Regenerate sqlc + wire
        run: |
          go generate ./...
          go run github.com/google/wire/cmd/wire@latest ./internal/server/...
      - name: Regenerate swagger docs
        run: go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/service/main.go -o docs/swagger
      - name: Fail on drift
        run: git diff --exit-code

  integration:
    name: Integration (auth sessions)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: erp_test
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Flyway migrations
        run: |
          # --network host: the flyway container must reach the postgres
          # service container's published port on the runner host; without it
          # 127.0.0.1:5432 points at the container's own loopback ("Connection
          # refused").
          docker run --rm --network host \
            -v "$PWD/migrations:/flyway/sql" \
            flyway/flyway:9.20.0 \
            -url=jdbc:postgresql://127.0.0.1:5432/erp_test \
            -user=erp -password=erp \
            -locations=filesystem:/flyway/sql,filesystem:/flyway/sql/plugins,filesystem:/flyway/sql/seed \
            -outOfOrder=true migrate
      - name: Run integration tests (auth refresh sessions)
        env:
          DATABASE_URL: postgres://erp:erp@127.0.0.1:5432/erp_test?sslmode=disable
        run: go test -tags integration ./internal/auth/repository/...

  lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2