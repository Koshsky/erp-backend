# CI for erp-backend. Main is the only permanent branch.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source branch
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          [ -n "$BASE" ] || exit 0
          case "$HEAD" in
            main|dev|staging)
              echo "FAIL: use a short-lived topic branch targeting main"
              exit 1
              ;;
            *)
              echo "PASS: topic branch targets main"
              ;;
          esac

  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
