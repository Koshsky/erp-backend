version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "../../../../migrations/V1__initial_schema.sql"
    queries:
      - "./query"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        out: "./sqlc"
        emit_interface: false
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "date"
            go_type: "time.Time"
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "jsonb"
            go_type: "encoding/json.RawMessage"
          - db_type: "json"
            go_type: "encoding/json.RawMessage"
          - db_type: "decimal"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "numeric"
            go_type: "github.com/shopspring/decimal.Decimal"
          - db_type: "money"
            go_type: "int64"
          - db_type: "timestamptz"
            nullable: true
            go_type: "*time.Time"
          - db_type: "text"
            nullable: true
            go_type: "sql.NullString"
          - db_type: "integer"
            nullable: true
            go_type: "sql.NullInt64"
