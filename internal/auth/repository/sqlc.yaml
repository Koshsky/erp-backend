version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "../../../migrations/V1__initial_schema.sql"
    queries:
      - "./query"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        out: "./sqlc"
        emit_interface: false
        omit_unused_structs: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          # NOTE: no nullable timestamptz override. With pgx/v5 a nullable
          # timestamp defaults to pgtype.Timestamptz (NULL-safe both ways). A
          # "*time.Time" override is double-wrapped into **time.Time by sqlc,
          # which pgx/v5 cannot scan for non-NULL values — this made reuse
          # detection fail: scanning revoked_at of a revoked session errored
          # with "cannot scan timestamptz into ***time.Time".