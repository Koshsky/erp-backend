version: "2"

sql:
  - engine: "postgresql"
    schema:
      - "../../../migrations/V1__initial_schema.sql"
    queries:
      - "./query"
    gen:
      go:
        package: "sqlc"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        out: "./sqlc"
        emit_interface: false
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type: "*time.Time"