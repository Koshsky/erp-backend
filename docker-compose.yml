services:
  erp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: erp-dev
    env_file:
      - ./.env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      flyway:
        condition: service_completed_successfully
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: db-dev
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  flyway:
    image: flyway/flyway:9.20.0
    container_name: migrator-dev
    volumes:
      - ./migrations:/flyway/sql
    command:
      - -url=jdbc:postgresql://db:5432/${DATABASE_NAME}
      - -user=${DATABASE_USER}
      - -password=${DATABASE_PASSWORD}
      - -locations=filesystem:/flyway/sql,filesystem:/flyway/sql/plugins,filesystem:/flyway/sql/seed
      - -outOfOrder=true
      - migrate
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP/gRPC collector (backend: jaeger:4317)
    networks:
      - app-network

  # Audit-log storage: Grafana Loki + Grafana UI. Ports are published so the
  # host-run `air` (make dev) reaches loki at localhost:3100, matching
  # config.yaml (audit.url) — same infra config as the root docker-compose.yml.
  loki:
    image: grafana/loki:3.4.2
    container_name: loki-dev
    command: -config.file=/etc/loki/loki.yaml
    volumes:
      - ../../infra/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.6.1
    container_name: grafana-dev
    ports:
      - "3000:3000"
    environment:
      # Default admin password comes from the repo .env (dev stack).
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
    volumes:
      - ../../infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki
    networks:
      - app-network

volumes:
  db_data:
  loki_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
